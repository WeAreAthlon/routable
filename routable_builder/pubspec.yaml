name: routable_builder
description: "Routable is a package that provides code generation for routing in Flutter applications"
version: 1.2.4
homepage: "https://github.com/WeAreAthlon/routable"

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  analyzer: ">=7.4.0 <9.0.0"
  build: ">=3.1.0 <5.0.0"
  glob: ^2.1.3
  source_gen: ">=3.1.0 <5.0.0"

  routable_annotations: ^0.3.0
   #path: ../routable_annotations

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ">=5.1.1 <7.0.0"
